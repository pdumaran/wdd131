<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Review Form</title>
    <meta name="description"
        content="Product Review Form created for WDD 131. Features dynamic product selection, star ratings, and review counter tracking using LocalStorage.">
    <meta name="author" content="Pierre Phil D. Bangay">

    <!-- Preconnect & Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

    <!-- Stylesheet -->
    <link rel="stylesheet" href="styles/form.css">

    <!-- JavaScript -->
    <script src="scripts/form.js" defer></script>
</head>

<body>
    <header>
        <h1>Product Review</h1>
    </header>

    <main>
        <form method="get" action="review.html">

            <!-- Product Name -->
            <div class="form-item">
                <label for="product-name">Product Name <span class="required-indicator"
                        aria-label="required">*</span></label>
                <select id="product-name" name="product-name" required>
                    <option value="" disabled selected>Select a Product ...</option>
                </select>
            </div>

            <!-- Overall Rating -->
            <fieldset class="form-item rating-fieldset">
                <legend>Overall Rating <span class="required-indicator" aria-label="required">*</span></legend>
                <div class="stars-container">
                    <div class="star-option">
                        <label for="star1">&#9734;</label>
                        <input type="radio" id="star1" name="rating" value="1" required>
                    </div>
                    <div class="star-option">
                        <label for="star2">&#9734;&#9734;</label>
                        <input type="radio" id="star2" name="rating" value="2" required>
                    </div>
                    <div class="star-option">
                        <label for="star3">&#9734;&#9734;&#9734;</label>
                        <input type="radio" id="star3" name="rating" value="3" required>
                    </div>
                    <div class="star-option">
                        <label for="star4">&#9734;&#9734;&#9734;&#9734;</label>
                        <input type="radio" id="star4" name="rating" value="4" required>
                    </div>
                    <div class="star-option">
                        <label for="star5">&#9734;&#9734;&#9734;&#9734;&#9734;</label>
                        <input type="radio" id="star5" name="rating" value="5" required>
                    </div>
                </div>
            </fieldset>

            <!-- Date of Installation -->
            <div class="form-item">
                <label for="install-date">Date of Installation <span class="required-indicator"
                        aria-label="required">*</span></label>
                <input type="date" id="install-date" name="install-date" required>
            </div>

            <!-- Useful Features -->
            <fieldset class="form-item checkbox-fieldset">
                <legend>Which features did you find useful in the product?</legend>
                <p class="field-instruction">(Check all that apply)</p>

                <div class="checkbox-option">
                    <input type="checkbox" id="feature-durability" name="features" value="durability">
                    <label for="feature-durability">Durability</label>
                </div>

                <div class="checkbox-option">
                    <input type="checkbox" id="feature-ease" name="features" value="ease-of-use">
                    <label for="feature-ease">Ease of Use</label>
                </div>

                <div class="checkbox-option">
                    <input type="checkbox" id="feature-performance" name="features" value="performance">
                    <label for="feature-performance">Performance</label>
                </div>

                <div class="checkbox-option">
                    <input type="checkbox" id="feature-design" name="features" value="design">
                    <label for="feature-design">Design</label>
                </div>
            </fieldset>

            <!-- Written Review -->
            <div class="form-item">
                <label for="review-text">Written Review <span class="optional-tag">(Optional)</span></label>
                <textarea id="review-text" name="review-text" rows="4"></textarea>
            </div>

            <!-- User Name -->
            <div class="form-item">
                <label for="user-name">Your Name <span class="optional-tag">(Optional)</span></label>
                <input type="text" id="user-name" name="user-name">
            </div>

            <!-- Submit Button -->
            <div class="form-item">
                <input type="submit" value="Post Review" class="submit-btn">
            </div>

        </form>
    </main>

    <footer>
        <p>&copy; <span id="currentyear"></span> | Pierre Phil D. Bangay | Western Visayas, Philippines</p>
        <p id="lastModified"></p>
    </footer>
</body>

</html>
