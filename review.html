<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Review Submitted - Thank You!</title>
    <meta name="description"
        content="Confirmation page for submitted product reviews. Tracks total reviews submitted using LocalStorage.">
    <meta name="author" content="Pierre Phil D. Bangay">

    <!-- Preconnect & Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

    <!-- Stylesheet -->
    <link rel="stylesheet" href="styles/form.css">

    <!-- JavaScript -->
    <script src="scripts/review.js" defer></script>
</head>

<body>
    <header>
        <h1>Product Review</h1>
    </header>

    <main class="confirmation-container">
        <section class="confirmation-card">
            <h2>Thank You for Your Feedback!</h2>
            <p>Your product review has been successfully submitted.</p>

            <div class="counter-display">
                <p>Total Reviews Completed: <span id="review-counter">0</span></p>
            </div>

            <a href="form.html" class="back-link">Submit Another Review</a>
        </section>
    </main>

    <footer>
        <p>&copy; <span id="currentyear"></span> | Pierre Phil D. Bangay | Western Visayas, Philippines</p>
        <p id="lastModified"></p>
    </footer>
</body>

</html>
